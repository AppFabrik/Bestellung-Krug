<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17172f">
  <title>Bestellformular</title>
  <style>
    :root{--ink:#17172f;--muted:#77778e;--accent:#7657f6;--accent2:#22c7b8;--line:#e9e8f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:36px 18px;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,rgba(34,199,184,.22),transparent 28rem),radial-gradient(circle at 90% 85%,rgba(118,87,246,.24),transparent 30rem),#f3f3fa}
    .card{width:min(100%,540px);overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(35,31,85,.13)}
    
    /* Header-Bereich mit Layout für Maskottchen */
    .top{position:relative;padding:34px 36px 30px;color:#fff;background:linear-gradient(125deg,#25234d,#6047d9 68%,#7657f6);overflow:hidden}
    .top:after{content:"";position:absolute;width:190px;height:190px;right:-48px;top:-80px;border:28px solid rgba(255,255,255,.10);border-radius:50%}
    .top-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:15px}
    .top-text{flex:1}
    
    /* Maskottchen-Styling: entfernt den schwarzen Hintergrund */
    .mascot{width:110px;height:auto;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));flex-shrink:0}

    .eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:13px;color:#c9fff7;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
    .eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 5px rgba(34,199,184,.16)}
    h1{margin:0;font-size:clamp(26px,6vw,36px);line-height:1.08;letter-spacing:-.045em}
    .top p{margin:12px 0 0;color:rgba(255,255,255,.78);font-size:14px;line-height:1.55}
    
    form{padding:30px 36px 34px}.field{margin-bottom:20px}
    label{display:block;margin:0 0 8px 2px;font-size:13px;font-weight:750}.required{color:var(--accent)}
    input,select{width:100%;height:52px;padding:0 15px;border:1.5px solid var(--line);border-radius:13px;outline:none;color:var(--ink);background:#fbfbfe;font:inherit;font-size:15px;transition:border-color .18s,box-shadow .18s,background .18s}
    input::placeholder{color:#aaa9bb}input:focus,select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(118,87,246,.11)}select{cursor:pointer}
    button{width:100%;min-height:56px;margin-top:5px;border:0;border-radius:15px;color:#fff;background:linear-gradient(100deg,var(--accent),#6047d9);box-shadow:0 10px 22px rgba(118,87,246,.25);font:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s}
    button:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(118,87,246,.3)}button:disabled{opacity:.65;cursor:wait}
    .status{display:none;margin-top:17px;padding:14px 15px;border-radius:12px;color:#12675e;background:#e8fbf7;font-size:13px;line-height:1.5}.status.show{display:block}
    .footer{padding:0 36px 25px;color:#9998aa;font-size:11px;text-align:center}
    @media(max-width:480px){body{padding:16px 12px}.card{border-radius:22px}.top{padding:24px 20px}.mascot{width:85px}form{padding:25px 24px 28px}.footer{padding:0 24px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <header class="top">
      <div class="top-content">
        <div class="top-text">
          <div class="eyebrow">Bestellung</div>
          <h1>Deine Auswahl.<br>Deine Bestellung.</h1>
        </div>
        <!-- Maskottchen Klaus als PNG -->
        <img src="Klaus_1_blank.png" alt="Maskottchen Klaus" class="mascot">
      </div>
      <p>Fülle kurz die Angaben aus und sende deine Bestellung direkt ab.</p>
    </header>

    <form id="orderForm" action="https://hook.eu1.make.com/8iqs1jhf9rpzyuxp8mja6q4x0d7kdhie" method="post" target="makeResponseFrame" accept-charset="UTF-8">
      <div class="field">
        <label for="vorname">Name <span class="required">*</span></label>
        <input id="vorname" name="Name" type="text" placeholder="Dein Vorname" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="nachname">Nachname <span class="required">*</span></label>
        <input id="nachname" name="Nachname" type="text" placeholder="Dein Nachname" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="groesse">Größe <span class="required">*</span></label>
        <select id="groesse" name="Größe" required>
          <option value="" selected disabled>Bitte Größe auswählen</option>
          <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>3XL</option><option>4XL</option><option>5XL</option>
        </select>
      </div>
      <div class="field">
        <label for="artikel">Artikelbezeichnung <span class="required">*</span></label>
        <input id="artikel" name="Artikelbezeichnung" type="text" placeholder="Welchen Artikel möchtest du bestellen?" required>
      </div>
      <input type="hidden" id="bestelldatum" name="Bestelldatum">
      <button id="sendButton" type="submit">Bestellung senden&nbsp; →</button>
      <div class="status" id="statusMessage" role="status" aria-live="polite">Danke! Deine Bestellung wurde an Make übermittelt.</div>
    </form>
    <div class="footer">Bitte prüfe deine Angaben vor dem Absenden.</div>
  </main>
  <iframe name="makeResponseFrame" id="makeResponseFrame" title="Übermittlungsantwort" hidden></iframe>
  <script>
    const form=document.getElementById('orderForm');
    const frame=document.getElementById('makeResponseFrame');
    const button=document.getElementById('sendButton');
    const status=document.getElementById('statusMessage');
    let submitted=false;
    form.addEventListener('submit',()=>{
      document.getElementById('bestelldatum').value=new Date().toLocaleString('de-DE');
      status.classList.remove('show');
      button.disabled=true;
      button.textContent='Wird gesendet …';
      submitted=true;
    });
    frame.addEventListener('load',()=>{
      if(!submitted)return;
      submitted=false;
      status.classList.add('show');
      button.disabled=false;
      button.textContent='Bestellung senden  →';
      form.reset();
    });
  </script>
</body>
</html>
